backend:
  name: github
  repo: barberloungerio/barberloungerio.com.br
  branch: main
  auth_url: https://auth.decapcms.org/authorize

media_folder: "public/images"
public_folder: "images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    fields:
      - {name: "title", label: "Title", widget: "string"}
      - {name: "body", label: "Body", widget: "markdown"}
